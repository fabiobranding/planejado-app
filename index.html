<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Orçamento – Programar Marmoraria</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f4f0; min-height: 100vh; }

  /* ── TOPO ── */
  .topo { background: #1B5E20; color: #fff; padding: 18px 32px; display: flex; align-items: center; gap: 16px; }
  .topo img { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background:#fff; }
  .topo h1 { font-size: 22px; font-weight: 900; letter-spacing: 2px; }
  .topo span { font-size: 12px; color: #a5d6a7; margin-top: 2px; display: block; }

  /* ── LAYOUT ── */
  .container { max-width: 860px; margin: 28px auto; padding: 0 16px 60px; }

  /* ── CARD ── */
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 24px 28px; margin-bottom: 20px; }
  .card-title { font-size: 13px; font-weight: 800; color: #1B5E20; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 18px; padding-bottom: 8px; border-bottom: 2px solid #E8F5E9; }

  /* ── CAMPOS ── */
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; flex: 1; min-width: 160px; }
  .field label { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
  .field input { border: 1.5px solid #ddd; border-radius: 6px; padding: 9px 12px; font-size: 13px; outline: none; transition: border .2s; }
  .field input:focus { border-color: #2E7D32; }

  /* ── CÔMODOS ── */
  .comodo { background: #F9FBF9; border: 1.5px solid #C8E6C9; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; position: relative; }
  .comodo-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .comodo-header input { flex: 1; border: 1.5px solid #A5D6A7; border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 700; color: #1B5E20; background: #E8F5E9; outline: none; }
  .comodo-header input:focus { border-color: #1B5E20; }
  .btn-remover-comodo { background: none; border: none; color: #c62828; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
  .btn-remover-comodo:hover { background: #ffebee; }

  /* ── ITENS ── */
  .itens-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .item-row { display: flex; gap: 8px; align-items: center; }
  .item-row input { border: 1.5px solid #ddd; border-radius: 5px; padding: 7px 10px; font-size: 12px; outline: none; }
  .item-row input:focus { border-color: #2E7D32; }
  .item-desc { flex: 2.5; }
  .item-dim  { flex: 1.2; }
  .item-qtd  { flex: 1; }
  .item-obs  { flex: 1.2; }
  .btn-remover-item { background: none; border: none; color: #bbb; font-size: 16px; cursor: pointer; padding: 2px 6px; flex-shrink: 0; }
  .btn-remover-item:hover { color: #c62828; }
  .itens-labels { display: flex; gap: 8px; margin-bottom: 4px; padding: 0 2px; }
  .itens-labels span { font-size: 10px; color: #888; font-weight: 700; text-transform: uppercase; }
  .itens-labels .l-desc { flex: 2.5; }
  .itens-labels .l-dim  { flex: 1.2; }
  .itens-labels .l-qtd  { flex: 1; }
  .itens-labels .l-obs  { flex: 1.2; }
  .itens-labels .l-x    { width: 28px; }

  /* ── BOTÕES ── */
  .btn-add-item { background: none; border: 1.5px dashed #A5D6A7; color: #2E7D32; border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-weight: 700; margin-top: 4px; }
  .btn-add-item:hover { background: #E8F5E9; }
  .btn-add-comodo { background: #E8F5E9; border: 1.5px solid #A5D6A7; color: #1B5E20; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 20px; }
  .btn-add-comodo:hover { background: #C8E6C9; }
  .btn-gerar { background: #1B5E20; color: #fff; border: none; border-radius: 10px; padding: 16px 0; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; letter-spacing: 2px; box-shadow: 0 4px 16px rgba(27,94,32,.3); transition: background .2s; }
  .btn-gerar:hover { background: #2E7D32; }
</style>
</head>

let comodoCount = 0;

function addComodo(dados) {
  const id = comodoCount++;
  const nome = dados ? dados.nome : "";
  const div = document.createElement("div");
  div.className = "comodo";
  div.id = `comodo-${id}`;
  div.innerHTML = `
    <div class="comodo-header">
      <input type="text" placeholder="Nome do cômodo (ex: Cozinha)" value="${nome}" id="comodo-nome-${id}" />
      <button class="btn-remover-comodo" onclick="document.getElementById('comodo-${id}').remove()">✕</button>
    </div>
    <div class="itens-labels">
      <span class="l-desc">Descrição</span>
      <span class="l-dim">Dimensões</span>
      <span class="l-qtd">Qtd</span>
      <span class="l-obs">Observação</span>
      <span class="l-x"></span>
    </div>
    <div class="itens-lista" id="itens-${id}"></div>
    <button class="btn-add-item" onclick="addItem(${id})">+ item</button>
  `;
  document.getElementById("comodos-lista").appendChild(div);
  if (dados) dados.itens.forEach(item => addItem(id, item));
  else addItem(id);
}

let itemCount = 0;
function addItem(comodoId, dados) {
  const id = itemCount++;
  const row = document.createElement("div");
  row.className = "item-row";
  row.id = `item-${id}`;
  row.innerHTML = `
    <input class="item-desc" type="text" placeholder="Descrição" value="${dados ? dados.desc : ''}" />
    <input class="item-dim"  type="text" placeholder="Ex: 80x40cm" value="${dados ? dados.dim : ''}" />
    <input class="item-qtd"  type="text" placeholder="Ex: 2 un." value="${dados ? dados.qtd : ''}" />
    <input class="item-obs"  type="text" placeholder="Obs." value="${dados ? dados.obs : ''}" />
    <button class="btn-remover-item" onclick="document.getElementById('item-${id}').remove()">✕</button>
  `;
  document.getElementById(`itens-${comodoId}`).appendChild(row);
}

function coletarDados() {
  const comodos = [];
  document.querySelectorAll(".comodo").forEach(c => {
    const id = c.id.replace("comodo-", "");
    const nome = document.getElementById(`comodo-nome-${id}`).value;
    const itens = [];
    c.querySelectorAll(".item-row").forEach(row => {
      const inputs = row.querySelectorAll("input");
      itens.push({ desc: inputs[0].value, dim: inputs[1].value, qtd: inputs[2].value, obs: inputs[3].value });
    });
    if (nome || itens.length) comodos.push({ nome, itens });
  });
  return {
    numero: document.getElementById("numero").value,
    cliente: document.getElementById("cliente").value,
    data: document.getElementById("data").value,
    validade: document.getElementById("validade").value,
    material: document.getElementById("material").value,
    valor: document.getElementById("valor").value,
    comodos
  };
}
