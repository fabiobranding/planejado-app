<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo Orçamento — OrçaMármore</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme-glass.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Novo Orçamento</h2>
      <div class="user-info" id="user-name"></div>
    </div>
    <div class="content">

      <!-- Cabeçalho -->
      <div class="card">
        <div class="card-title">Dados do Orçamento</div>
        <div class="form-row">
          <div class="form-group" style="max-width:160px">
            <label>Número</label>
            <input type="text" id="numero" readonly style="background:#f5f5f5">
          </div>
          <div class="form-group" style="max-width:140px">
            <label>Data</label>
            <input type="text" id="data">
          </div>
          <div class="form-group">
            <label>Cliente</label>
            <input type="text" id="cliente" placeholder="Nome do cliente">
          </div>
          <div class="form-group" style="max-width:180px">
            <label>WhatsApp do Cliente</label>
            <input type="tel" id="telefonecliente" placeholder="(31) 99999-9999">
          </div>
          <div class="form-group" style="max-width:140px">
            <label>Validade</label>
            <select id="validade">
              <option>15 dias</option>
              <option>30 dias</option>
              <option>45 dias</option>
              <option>60 dias</option>
            </select>
          </div>
          <div class="form-group" style="max-width:160px">
            <label>Status</label>
            <select id="status">
              <option>Em aberto</option>
              <option>Aprovado</option>
              <option>Em produção</option>
              <option>Entregue</option>
              <option>Atrasado</option>
              <option>Recusado</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Material principal</label>
            <input type="text" id="material" placeholder="Ex: Mármore Champagne, Granito Preto São Gabriel...">
          </div>
        </div>
      </div>

      <!-- Ambientes -->
      <div class="card">
        <div class="card-title">Ambientes e Itens</div>
        <div id="ambientes-container"></div>
        <button class="btn-add-ambiente" onclick="addAmbiente()">+ Adicionar Ambiente</button>
      </div>

      <!-- Total -->
      <div class="card">
        <div class="card-title">Valor Total</div>
        <div class="form-row">
          <div class="form-group" style="max-width:200px">
            <label>Valor Total (R$)</label>
            <input type="text" id="valor" placeholder="0,00" oninput="formatarValorInput(this)" style="font-size:18px;font-weight:700;color:#1E3A5F">
          </div>
        </div>
        <div class="total-box">
          <span class="label">TOTAL</span>
          <span class="valor" id="total-display">R$ 0,00</span>
        </div>
      </div>

      <!-- Pagamento -->
      <div class="card">
        <div class="card-title">Pagamento</div>
        <div class="form-row">
          <div class="form-group" style="max-width:200px">
            <label>Valor Pago (R$)</label>
            <input type="text" id="valor-pago" placeholder="0,00" oninput="formatarValorPagoInput(this)">
          </div>
          <div class="form-group" style="max-width:200px">
            <label>Forma de Pagamento</label>
            <select id="forma-pagamento">
              <option value="">Selecione...</option>
              <option>Pix</option>
              <option>Débito</option>
              <option>Crédito</option>
              <option>Dinheiro</option>
              <option>Transferência</option>
              <option>Parcelado</option>
            </select>
          </div>
          <div class="form-group" style="max-width:180px">
            <label>Data do Pagamento</label>
            <input type="text" id="data-pagamento" placeholder="dd/mm/aaaa">
          </div>
        </div>
        <div id="status-pagamento-box" style="display:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;margin-top:8px"></div>
      </div>

      <!-- Ações -->
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="salvar()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Salvar Orçamento</button>
        <button class="btn btn-success" onclick="gerarPDFAtual()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Gerar PDF</button>
        <button class="btn btn-whats" onclick="enviarWhatsApp()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Enviar WhatsApp</button>
        <button class="btn btn-outline" onclick="location.href='orcamentos.html'">Cancelar</button>
      </div>

    </div>
  </div>
</div>

<!-- Datalist catálogo -->
<datalist id="catalogo-itens"></datalist>

<script src="js/core.js"></script>
<script src="js/pdf.js"></script>
<script>
requireAuth();
applyStoredTheme();
applyCompanyTheme();
seedDemoData();
document.getElementById('sidebar').innerHTML = renderSidebar('novo');
renderThemeToggle();
const u = getUsuario();
const emp = getEmpresa();
document.getElementById('user-name').textContent = emp.nome || (u && u.marmoraria) || '';

var orcId = null;
var ambientes = [];

// Carregar orçamento se for edição
var urlParams = new URLSearchParams(window.location.search);
var editId = urlParams.get('id');
if (editId) {
  var orcs = getOrcamentos();
  var orc = orcs.find(function(o) { return o.id === editId; });
  if (orc) {
    orcId = orc.id;
    document.getElementById('page-title').textContent = 'Editar Orçamento';
    document.getElementById('numero').value = orc.numero || '';
    document.getElementById('data').value = orc.data || hoje();
    document.getElementById('cliente').value = orc.cliente || '';
    document.getElementById('telefonecliente').value = orc.telefonecliente || '';
    document.getElementById('material').value = orc.material || '';
    document.getElementById('valor').value = orc.valor ? formatBRL(orc.valor) : '';
    document.getElementById('total-display').textContent = 'R$ ' + (orc.valor ? formatBRL(orc.valor) : '0,00');
    var valSelect = document.getElementById('validade');
    for (var i=0;i<valSelect.options.length;i++){
      if (valSelect.options[i].text === orc.validade) { valSelect.selectedIndex=i; break; }
    }
    var stSelect = document.getElementById('status');
    for (var i=0;i<stSelect.options.length;i++){
      if (stSelect.options[i].text === orc.status) { stSelect.selectedIndex=i; break; }
    }
    ambientes = JSON.parse(JSON.stringify(orc.ambientes || []));
    document.getElementById('valor-pago').value = orc.valor_pago ? formatBRL(orc.valor_pago) : '';
    document.getElementById('forma-pagamento').value = orc.forma_pagamento || '';
    document.getElementById('data-pagamento').value = orc.data_pagamento || '';
    atualizarStatusPagamento();
  }
} else {
  document.getElementById('numero').value = proximoNumero();
  document.getElementById('data').value = hoje();
}

if (!ambientes.length) ambientes.push(novoAmbienteObj('Ambiente 1'));

// Preenche datalist
var cat = getCatalogo();
var dl = document.getElementById('catalogo-itens');
cat.forEach(function(c) {
  var opt = document.createElement('option');
  opt.value = c.nome;
  dl.appendChild(opt);
});

function novoAmbienteObj(nome) {
  return { nome: nome || '', itens: [novoItem()] };
}
function novoItem() {
  return { desc: '', dim: '', qtd: '', obs: '' };
}

function renderAmbientes() {
  var container = document.getElementById('ambientes-container');
  container.innerHTML = '';
  ambientes.forEach(function(amb, ai) {
    var div = document.createElement('div');
    div.className = 'ambiente-card';
    var labels = '<div class="item-labels">' +
      '<span>Descrição</span><span>Dimensões</span><span>Qtd</span><span>Observação</span><span></span>' +
      '</div>';
    var itensHTML = '';
    (amb.itens || []).forEach(function(item, ii) {
      itensHTML += '<div class="item-row">' +
        '<input list="catalogo-itens" value="' + esc(item.desc) + '" placeholder="Descrição do serviço" oninput="setItem(' + ai + ',' + ii + ',\'desc\',this.value)">' +
        '<input value="' + esc(item.dim) + '" placeholder="Ex: 1,20 x 0,60 m" oninput="setItem(' + ai + ',' + ii + ',\'dim\',this.value)">' +
        '<input value="' + esc(item.qtd) + '" placeholder="Ex: 2 unid." oninput="setItem(' + ai + ',' + ii + ',\'qtd\',this.value)">' +
        '<input value="' + esc(item.obs) + '" placeholder="Obs." oninput="setItem(' + ai + ',' + ii + ',\'obs\',this.value)">' +
        '<button class="btn-remove" onclick="removeItem(' + ai + ',' + ii + ')">×</button>' +
        '</div>';
    });
    div.innerHTML =
      '<div class="ambiente-header">' +
        '<input class="ambiente-nome" value="' + esc(amb.nome) + '" placeholder="Nome do ambiente" oninput="setAmbNome(' + ai + ',this.value)">' +
        '<button class="btn btn-sm btn-danger" onclick="removeAmbiente(' + ai + ')">Remover</button>' +
      '</div>' +
      labels + itensHTML +
      '<button class="btn-add-item" onclick="addItem(' + ai + ')">+ Adicionar item</button>';
    container.appendChild(div);
  });
}

function esc(s) { return (s||'').replace(/"/g,'&quot;'); }
function setAmbNome(ai, v) { ambientes[ai].nome = v; }
function setItem(ai, ii, field, v) { ambientes[ai].itens[ii][field] = v; }
function addItem(ai) { ambientes[ai].itens.push(novoItem()); renderAmbientes(); }
function removeItem(ai, ii) {
  if (ambientes[ai].itens.length <= 1) return;
  ambientes[ai].itens.splice(ii, 1);
  renderAmbientes();
}
function addAmbiente() { ambientes.push(novoAmbienteObj('Novo Ambiente')); renderAmbientes(); }
function removeAmbiente(ai) {
  if (ambientes.length <= 1) { alert('É necessário ao menos um ambiente.'); return; }
  if (!confirm('Remover este ambiente?')) return;
  ambientes.splice(ai, 1);
  renderAmbientes();
}

function formatarValorPagoInput(el) {
  var v = el.value.replace(/\D/g, '');
  if (!v) { el.value = ''; atualizarStatusPagamento(); return; }
  var num = parseInt(v, 10) / 100;
  el.value = formatBRL(num);
  atualizarStatusPagamento();
}

function atualizarStatusPagamento() {
  var box = document.getElementById('status-pagamento-box');
  var vTotal = getValor();
  var vPago = parseBRL(document.getElementById('valor-pago').value) || 0;
  if (!vTotal) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  if (vPago >= vTotal) {
    box.style.background = '#dcfce7'; box.style.color = '#166534'; box.textContent = 'Pago';
  } else if (vPago > 0) {
    box.style.background = '#fef9c3'; box.style.color = '#854d0e'; box.textContent = 'Parcial — Restante: R$ ' + formatBRL(vTotal - vPago);
  } else {
    box.style.background = '#fee2e2'; box.style.color = '#991b1b'; box.textContent = 'Pendente';
  }
}

function formatarValorInput(el) {
  var v = el.value.replace(/\D/g, '');
  if (!v) { el.value = ''; document.getElementById('total-display').textContent = 'R$ 0,00'; atualizarStatusPagamento(); return; }
  var num = parseInt(v, 10) / 100;
  el.value = formatBRL(num);
  document.getElementById('total-display').textContent = 'R$ ' + formatBRL(num);
  atualizarStatusPagamento();
}

function getValor() {
  return parseBRL(document.getElementById('valor').value);
}

function getOrcamentoAtual() {
  return {
    id: orcId || gerarId(),
    numero: document.getElementById('numero').value,
    cliente: document.getElementById('cliente').value,
    telefonecliente: document.getElementById('telefonecliente').value,
    data: document.getElementById('data').value,
    validade: document.getElementById('validade').value,
    status: document.getElementById('status').value,
    material: document.getElementById('material').value,
    valor: getValor(),
    valor_pago: parseBRL(document.getElementById('valor-pago').value) || 0,
    forma_pagamento: document.getElementById('forma-pagamento').value,
    data_pagamento: document.getElementById('data-pagamento').value,
    ambientes: JSON.parse(JSON.stringify(ambientes))
  };
}

function salvar() {
  var orc = getOrcamentoAtual();
  if (!orc.cliente) { alert('Informe o nome do cliente.'); return; }
  if (!orcId) orcId = orc.id;
  saveOrcamento(orc);
  alert('Orçamento salvo com sucesso!');
  location.href = 'orcamentos.html';
}

function gerarPDFAtual() {
  var orc = getOrcamentoAtual();
  if (!orc.cliente) { alert('Informe o nome do cliente.'); return; }
  gerarPDF(orc);
}

function enviarWhatsApp() {
  var orc = getOrcamentoAtual();
  if (!orc.cliente) { alert('Informe o nome do cliente antes de enviar.'); return; }
  saveOrcamento(orc);
  var emp = getEmpresa();
  var msg = emp.msgWhatsApp ||
    'Olá, ' + (orc.cliente||'') + '! 👋\nSegue seu orçamento N° ' + (orc.numero||'') + ' no valor de *R$ ' + formatBRL(orc.valor) + '*.\nQualquer dúvida estou à disposição! 😊';
  var fone = (orc.telefonecliente||'').replace(/\D/g,'');
  if (fone && fone.length >= 10) {
    if (!fone.startsWith('55')) fone = '55' + fone;
    window.open('https://wa.me/' + fone + '?text=' + encodeURIComponent(msg), '_blank');
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  }
}

renderAmbientes();
</script>
</body>
</html>
