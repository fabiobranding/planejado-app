<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orçamentos — Planejado.app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-logo">Planejado<span>.app</span></div>
    <a href="dashboard.html" class="nav-link">

      Dashboard
    </a>
    <a href="orcamentos.html" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Orçamentos
    </a>
    <a href="catalogo.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Catálogo
    </a>
    <a href="configuracoes.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Configurações
    </a>
    <a href="planos.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Planos
    </a>
    <div class="sidebar-bottom">
      <button onclick="logout()" class="btn-logout">&#x2192; Sair</button>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="app-header">
    <button class="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div>
      <div class="app-header-title" id="headerEmpresa">Minha Empresa</div>
      <div class="app-header-sub">Orçamentos</div>
    </div>
    <div class="header-right">
      <a href="novo-orcamento.html" class="btn btn-amber">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo Orçamento
      </a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="app-main">
    <h1 class="page-title">Orçamentos</h1>
    <p class="page-subtitle">Gerencie todos os seus orçamentos.</p>

    <div class="filters-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar por cliente..." oninput="filtrar()">
      </div>
      <select class="form-control" style="width:180px" id="statusFilter" onchange="filtrar()">
        <option value="">Todos os status</option>
        <option value="em_aberto">Em aberto</option>
        <option value="aprovado">Aprovado</option>
        <option value="em_producao">Em produção</option>
        <option value="entregue">Entregue</option>
        <option value="recusado">Recusado</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nº</th>
            <th>Cliente</th>
            <th>Data</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaOrcamentos">
          <tr><td colspan="6"><div class="empty-state"><p>Carregando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Status modal -->
<div class="modal-backdrop" id="statusModal">
  <div class="modal" style="max-width:320px">
    <div class="modal-title">Alterar status</div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <select class="form-control" id="novoStatus">
        <option value="em_aberto">Em aberto</option>
        <option value="aprovado">Aprovado</option>
        <option value="em_producao">Em produção</option>
        <option value="entregue">Entregue</option>
        <option value="recusado">Recusado</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="fecharStatusModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarStatus()">Salvar</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/pdf.js"></script>
<script>
requireAuth();

let _orcAtivo = null;

function filtrar() {
  const busca = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const lista = getOrcamentos().filter(o => {
    const matchCliente = !busca || (o.cliente || '').toLowerCase().includes(busca);
    const matchStatus = !status || o.status === status;
    return matchCliente && matchStatus;
  });
  renderTabela(lista);
}

function renderTabela(lista) {
  const tbody = document.getElementById('tabelaOrcamentos');
  if (lista.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>Nenhum orçamento encontrado.</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(o => `
    <tr>
      <td><strong>${o.numero || '—'}</strong></td>
      <td>${o.cliente || '—'}</td>
      <td>${formatDate(o.data)}</td>
      <td><strong>R$ ${formatBRL(o.total)}</strong></td>
      <td>
        <span style="cursor:pointer" onclick="abrirStatusModal('${o.id}','${o.status}')" title="Clique para alterar status">
          ${statusBadge(o.status)}
        </span>
      </td>
      <td class="actions-cell">
        <button onclick="verPDF('${o.id}')" class="btn-table btn-table-pdf" title="Ver PDF">PDF</button>
        <a href="novo-orcamento.html?id=${o.id}" class="btn-table btn-table-edit" title="Editar">Editar</a>
        <button onclick="duplicar('${o.id}')" class="btn-table btn-table-dup" title="Duplicar">Duplicar</button>
        <button onclick="enviarWA('${o.id}')" class="btn-table btn-table-wa" title="Enviar WhatsApp">WhatsApp</button>
        <button onclick="excluir('${o.id}')" class="btn-table btn-table-del" title="Excluir">Excluir</button>
      </td>
    </tr>
  `).join('');
}

function verPDF(id) {
  const o = getOrcamento(id);
  if (o) gerarPDF(o);
}

function duplicar(id) {
  const o = getOrcamento(id);
  if (!o) return;
  const novo = JSON.parse(JSON.stringify(o));
  novo.id = gerarId();
  novo.numero = proximoNumero();
  novo.data = todayISO();
  novo.status = 'em_aberto';
  // Regenerar IDs de ambientes e itens
  (novo.ambientes || []).forEach(a => {
    a.id = gerarId();
    (a.itens || []).forEach(i => i.id = gerarId());
  });
  saveOrcamento(novo);
  filtrar();
}

function enviarWA(id) {
  const o = getOrcamento(id);
  if (!o) return;
  const empresa = getEmpresa();
  const msg = (empresa.msgWA || `Olá ${o.cliente || ''}! Segue seu orçamento Nº ${o.numero || ''} no valor de R$ ${formatBRL(o.total)}. Qualquer dúvida estou à disposição!`).replace(/\n/g, '%0A');
  const tel = (o.clienteTel || '').replace(/\D/g, '');
  const url = tel
    ? `https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function excluir(id) {
  if (!confirm('Tem certeza que deseja excluir este orçamento? Esta ação não pode ser desfeita.')) return;
  deleteOrcamento(id);
  filtrar();
}

function abrirStatusModal(id, statusAtual) {
  _orcAtivo = id;
  document.getElementById('novoStatus').value = statusAtual || 'em_aberto';
  document.getElementById('statusModal').classList.add('open');
}
function fecharStatusModal() {
  document.getElementById('statusModal').classList.remove('open');
  _orcAtivo = null;
}
function salvarStatus() {
  if (!_orcAtivo) return;
  const o = getOrcamento(_orcAtivo);
  if (!o) return;
  o.status = document.getElementById('novoStatus').value;
  saveOrcamento(o);
  fecharStatusModal();
  filtrar();
}

document.getElementById('statusModal').addEventListener('click', e => {
  if (e.target === document.getElementById('statusModal')) fecharStatusModal();
});

filtrar();
</script>
</body>
</html>
