<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orçamentos — OrçaMármore</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme-glass.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <h2>Orçamentos</h2>
      <div class="user-info" id="user-name"></div>
    </div>
    <div class="content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <h3 style="font-size:16px;color:#1A1A1A">Todos os Orçamentos</h3>
        <div style="display:flex;gap:10px">
          <button onclick="abrirModalColar()" style="background:#fff;border:1.5px solid #E8E8E8;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;color:#444;transition:all .2s" onmouseover="this.style.background='#F5F5F5'" onmouseout="this.style.background='#fff'">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            Colar Orçamento
          </button>
          <button class="btn-novo" onclick="location.href='novo-orcamento.html'">+ Novo</button>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="text" id="busca" placeholder="Buscar por cliente ou número..." oninput="renderTabela()">
          <select id="filtroStatus" onchange="renderTabela()">
            <option value="">Todos os status</option>
            <option>Em aberto</option>
            <option>Aprovado</option>
            <option>Em produção</option>
            <option>Entregue</option>
            <option>Atrasado</option>
            <option>Recusado</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>N°</th><th>Cliente</th><th>Data</th><th>Material</th><th>Valor</th><th>Status</th><th>Ações</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
<!-- MODAL COLAR ORÇAMENTO -->
<div id="modal-colar" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:20px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <div style="padding:24px 28px;border-bottom:1px solid #F0F0F0;display:flex;justify-content:space-between;align-items:center">
      <div>
        <h3 style="font-size:17px;font-weight:700;color:#1A1A1A">Colar Orçamento</h3>
        <p style="font-size:12px;color:#aaa;margin-top:3px">Cole o texto — o sistema interpreta automaticamente</p>
      </div>
      <button onclick="fecharModalColar()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#aaa;line-height:1">×</button>
    </div>
    <div style="padding:24px 28px">
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px">
          <label style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">Cliente</label>
          <input id="mc-cliente" type="text" placeholder="Nome do cliente" style="width:100%;border:1px solid #E8E8E8;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;background:#FAFAFA">
        </div>
        <div style="flex:0 0 140px">
          <label style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">Valor Total</label>
          <input id="mc-valor" type="text" placeholder="57.990,00" style="width:100%;border:1px solid #E8E8E8;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;background:#FAFAFA">
        </div>
      </div>
      <textarea id="mc-texto" placeholder="Cole o orçamento aqui...

Hall social
Bancada 1.50x50
Testeira de 15cm
Sóculo de 10cm
Travertino

Jantar
Bancada de 3.00x60" style="width:100%;min-height:220px;border:1.5px dashed #E0E0E0;border-radius:12px;padding:16px;font-size:13px;font-family:monospace;line-height:1.8;resize:vertical;outline:none;background:#FAFAFA;color:#1A1A1A" oninput="previewColar()"></textarea>
      <div id="mc-preview" style="display:none;margin-top:12px;background:#F8F8F8;border-radius:10px;padding:12px 16px;font-size:12px;color:#555;line-height:1.8;max-height:150px;overflow-y:auto"></div>
    </div>
    <div style="padding:16px 28px;border-top:1px solid #F0F0F0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
      <button onclick="fecharModalColar()" style="background:#fff;border:1px solid #E8E8E8;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;color:#666">Cancelar</button>
      <button onclick="salvarColar()" style="background:#444;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer">Salvar no histórico</button>
      <button onclick="gerarPDFColar()" style="background:#1A1A1A;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Gerar PDF
      </button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/pdf.js"></script>
<script>
requireAuth();
applyStoredTheme();
applyCompanyTheme();
seedDemoData();
document.getElementById('sidebar').innerHTML = renderSidebar('orcamentos');
renderThemeToggle();
const u = getUsuario();
const emp = getEmpresa();
document.getElementById('user-name').textContent = emp.nome || (u && u.marmoraria) || '';

const STATUSES = ['Em aberto','Aprovado','Em produção','Entregue','Atrasado','Recusado'];

function renderTabela() {
  var busca = document.getElementById('busca').value.toLowerCase();
  var filtroStatus = document.getElementById('filtroStatus').value;
  var orcs = getOrcamentos().filter(function(o) {
    var matchBusca = !busca || (o.cliente||'').toLowerCase().includes(busca) || (o.numero||'').toLowerCase().includes(busca);
    var matchStatus = !filtroStatus || o.status === filtroStatus;
    return matchBusca && matchStatus;
  });

  var tbody = document.getElementById('tbody');
  if (!orcs.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#aaa">Nenhum orçamento encontrado.</td></tr>';
    return;
  }

  tbody.innerHTML = orcs.map(function(o) {
    return '<tr>' +
      '<td style="font-weight:700">' + (o.numero||'') + '</td>' +
      '<td><strong>' + (o.cliente||'') + '</strong></td>' +
      '<td>' + (o.data||'') + '</td>' +
      '<td style="color:#666;font-size:12px">' + (o.material||'') + '</td>' +
      '<td style="font-weight:700;color:#1E3A5F">R$ ' + formatBRL(o.valor) + '</td>' +
      '<td onclick="ciclarStatus(\'' + o.id + '\')" style="cursor:pointer" title="Clique para mudar o status">' + statusBadge(o.status) + '</td>' +
      '<td><div class="actions">' +
        '<button class="btn btn-sm btn-outline" onclick="location.href=\'novo-orcamento.html?id=' + o.id + '\'">Editar</button>' +
        '<button class="btn btn-sm btn-primary" onclick="verPDF(\'' + o.id + '\')">PDF</button>' +
        '<button class="btn btn-sm btn-whats" onclick="enviarWhats(\'' + o.id + '\')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></button>' +
        '<button class="btn btn-sm" style="background:#fff;border:1px solid #ddd" onclick="duplicar(\'' + o.id + '\')">Dup.</button>' +
        '<button class="btn btn-sm btn-danger" onclick="excluir(\'' + o.id + '\')">X</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function ciclarStatus(id) {
  var orcs = getOrcamentos();
  var orc = orcs.find(function(o) { return o.id === id; });
  if (!orc) return;
  var idx = STATUSES.indexOf(orc.status);
  var proximo = STATUSES[(idx + 1) % STATUSES.length];
  if (proximo === 'Aprovado' || proximo === 'Entregue') {
    abrirModalPgto(id, proximo);
    return;
  }
  orc.status = proximo;
  saveOrcamento(orc);
  renderTabela();
}

var _modalPgtoId = null;
var _modalProxStatus = null;

function abrirModalPgto(id, proxStatus) {
  _modalPgtoId = id;
  _modalProxStatus = proxStatus;
  var orc = getOrcamentos().find(function(o) { return o.id === id; });
  document.getElementById('mpgto-valor').value = orc.valor_pago ? formatBRL(orc.valor_pago) : formatBRL(orc.valor);
  document.getElementById('mpgto-forma').value = orc.forma_pagamento || '';
  document.getElementById('mpgto-data').value = orc.data_pagamento || hoje();
  if (proxStatus === 'Aprovado') {
    document.getElementById('modal-pgto-titulo').textContent = 'Aprovar Orçamento — Registrar Pagamento';
    document.getElementById('modal-pgto-sub').textContent = 'Informe os dados do pagamento para confirmar a aprovação.';
    document.getElementById('btn-confirmar-pgto').textContent = 'Confirmar e Aprovar';
  } else {
    document.getElementById('modal-pgto-titulo').textContent = 'Marcar como Entregue — Pagamento Final';
    document.getElementById('modal-pgto-sub').textContent = 'Confirme o recebimento total antes de marcar como entregue.';
    document.getElementById('btn-confirmar-pgto').textContent = 'Confirmar e Entregar';
  }
  atualizarRestante();
  document.getElementById('modal-pgto').style.display = 'flex';
  document.getElementById('mpgto-valor').focus();
}

function atualizarRestante() {
  var orc = getOrcamentos().find(function(o) { return o.id === _modalPgtoId; });
  if (!orc) return;
  var pago = parseBRL(document.getElementById('mpgto-valor').value) || 0;
  var rest = orc.valor - pago;
  var box = document.getElementById('mpgto-restante');
  if (rest > 0) {
    document.getElementById('mpgto-restante-val').textContent = 'R$ ' + formatBRL(rest);
    box.style.display = 'block';
    box.style.background = '#fef9c3';
  } else {
    box.style.display = 'none';
  }
}

function fecharModalPgto() {
  document.getElementById('modal-pgto').style.display = 'none';
  _modalPgtoId = null;
  _modalProxStatus = null;
}

function confirmarModalPgto() {
  if (!_modalPgtoId) return;
  var pago = parseBRL(document.getElementById('mpgto-valor').value) || 0;
  var forma = document.getElementById('mpgto-forma').value;
  var data = document.getElementById('mpgto-data').value;
  if (!forma) { alert('Selecione a forma de pagamento.'); return; }
  var orcs = getOrcamentos();
  var orc = orcs.find(function(o) { return o.id === _modalPgtoId; });
  if (!orc) return;
  orc.status = _modalProxStatus;
  orc.valor_pago = pago;
  orc.forma_pagamento = forma;
  orc.data_pagamento = data;
  saveOrcamento(orc);
  fecharModalPgto();
  renderTabela();
}

function verPDF(id) {
  var orc = getOrcamentos().find(function(o) { return o.id === id; });
  if (orc) gerarPDF(orc);
}

function enviarWhats(id) {
  var orc = getOrcamentos().find(function(o) { return o.id === id; });
  if (!orc) return;
  var emp = getEmpresa();
  var msg = emp.msgWhatsApp ||
    'Olá, ' + (orc.cliente||'') + '! Segue seu orçamento N° ' + (orc.numero||'') + ' no valor de R$ ' + formatBRL(orc.valor) + '. Em caso de dúvidas, estamos à disposição! 😊';
  // Usa telefone do cliente se disponível para abrir direto no contato
  var fone = (orc.telefonecliente||'').replace(/\D/g,'');
  if (fone && fone.length >= 10) {
    if (!fone.startsWith('55')) fone = '55' + fone;
    window.open('https://wa.me/' + fone + '?text=' + encodeURIComponent(msg), '_blank');
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  }
}

function duplicar(id) {
  var orc = getOrcamentos().find(function(o) { return o.id === id; });
  if (!orc) return;
  var novo = JSON.parse(JSON.stringify(orc));
  novo.id = gerarId();
  novo.numero = proximoNumero();
  novo.data = hoje();
  novo.status = 'Em aberto';
  saveOrcamento(novo);
  renderTabela();
}

function excluir(id) {
  if (!confirm('Excluir este orçamento? Esta ação não pode ser desfeita.')) return;
  deleteOrcamento(id);
  renderTabela();
}

renderTabela();
document.getElementById('mpgto-valor').addEventListener('input', atualizarRestante);

// ── MODAL COLAR ORÇAMENTO ────────────────────────────────────────────
function abrirModalColar() {
  document.getElementById('modal-colar').style.display = 'flex';
  setTimeout(function(){ document.getElementById('mc-texto').focus(); }, 100);
}
function fecharModalColar() {
  document.getElementById('modal-colar').style.display = 'none';
}

function extrairDescDim(linha) {
  // "Bancada 1.50x50" ou "Bancada de 3.00x60"
  var m = linha.match(/^(.+?)\s+(?:de\s+)?(\d+[.,]\d+\s*[xX]\s*\d+(?:[.,]\d+)?(?:\s*cm)?)\s*(.*)$/i);
  if (m) return { desc: (m[1] + (m[3] ? ' ' + m[3] : '')).trim(), dim: m[2].trim() };

  // "Testeira de 15cm" / "Sóculo de 10cm" / "Rodopia de 60cm"
  var m2 = linha.match(/^(.+?)\s+de\s+(\d+(?:[.,]\d+)?\s*(?:cm|m|mm)?)\s*$/i);
  if (m2) return { desc: m2[1].trim(), dim: m2[2].trim() };

  // "2.16x75 fechamentos laterais" — medida no início
  var m3 = linha.match(/^(\d+[.,]\d+\s*[xX]\s*\d+(?:[.,]\d+)?(?:\s*cm)?)\s+(.+)$/i);
  if (m3) return { desc: m3[2].trim(), dim: m3[1].trim() };

  // "65x50" no meio da linha
  var m4 = linha.match(/^(.+?)\s+(\d+\s*[xX]\s*\d+(?:\s*cm)?)\s*(.*)$/i);
  if (m4) return { desc: (m4[1] + (m4[3] ? ' ' + m4[3] : '')).trim(), dim: m4[2].trim() };

  // "de 60cm" no início
  var m5 = linha.match(/^de\s+(\d+(?:[.,]\d+)?\s*(?:cm|m)?)\s+(.+)$/i);
  if (m5) return { desc: m5[2].trim(), dim: m5[1].trim() };

  return { desc: linha, dim: '' };
}

var _orcColar = null;

function parsearColar() {
  var texto = document.getElementById('mc-texto').value;
  var clienteInput = document.getElementById('mc-cliente').value.trim();
  var valorInput = parseBRL(document.getElementById('mc-valor').value);
  var linhas = texto.split('\n').map(function(l){ return l.trim(); });

  var cliente = clienteInput;
  var valor = valorInput;

  // Extrair cliente e valor do texto
  linhas.forEach(function(l, idx) {
    if (!cliente && /^cliente\s*:/i.test(l)) {
      cliente = l.replace(/^cliente\s*:/i,'').trim();
      document.getElementById('mc-cliente').value = cliente;
    }
    if (/valor\s*total/i.test(l) || /^r\$\s*[\d]/i.test(l)) {
      var mv = l.match(/R\$\s*([\d.,]+)/i);
      if (mv && !valorInput) { valor = parseBRL(mv[1]); document.getElementById('mc-valor').value = formatBRL(valor); }
      else if (!mv && idx+1 < linhas.length) {
        var mv2 = linhas[idx+1].match(/R\$\s*([\d.,]+)/i);
        if (mv2 && !valorInput) { valor = parseBRL(mv2[1]); document.getElementById('mc-valor').value = formatBRL(valor); }
      }
    }
  });

  // Agrupar por blocos separados por linha vazia
  var blocos = [], bloco = [];
  linhas.forEach(function(l) {
    if (!l) { if (bloco.length) { blocos.push(bloco); bloco = []; } }
    else {
      if (/^(cliente|orçamento|valor\s*total|r\$\s*[\d])/i.test(l)) return;
      bloco.push(l);
    }
  });
  if (bloco.length) blocos.push(bloco);

  var ambientes = [];
  blocos.forEach(function(b) {
    if (!b.length) return;
    var nome = b[0];
    var itens = b.slice(1)
      .filter(function(l){ return l && !/^(travertino|taj\s*mahal|granito|mármore|marmore|quartzito|onix|basalto)/i.test(l) || b.length <= 2; })
      .map(function(l) {
        var parsed = extrairDescDim(l);
        return { desc: parsed.desc, dim: parsed.dim, qtd: '', obs: '' };
      });
    // Material = última linha se for nome de pedra
    var lastLine = b[b.length - 1];
    var material = '';
    if (/^(travertino|taj\s*mahal|granito|mármore|marmore|quartzito|onix|basalto)/i.test(lastLine) && b.length > 1) {
      material = lastLine;
      itens = b.slice(1, -1).map(function(l) {
        var p = extrairDescDim(l);
        return { desc: p.desc, dim: p.dim, qtd: '', obs: material };
      });
    }
    if (nome || itens.length) ambientes.push({ nome: nome, itens: itens });
  });

  return {
    id: gerarId(),
    numero: proximoNumero(),
    cliente: cliente || 'Cliente',
    data: hoje(),
    validade: '15 dias',
    status: 'Em aberto',
    material: '',
    valor: valor,
    valor_pago: 0,
    forma_pagamento: '',
    data_pagamento: '',
    ambientes: ambientes
  };
}

function previewColar() {
  var orc = parsearColar();
  _orcColar = orc;
  var html = '<strong>' + orc.cliente + '</strong> — R$ ' + formatBRL(orc.valor) + '<br>';
  orc.ambientes.forEach(function(a) {
    html += '<br><strong style="color:#1A1A1A">' + a.nome + '</strong><br>';
    a.itens.forEach(function(i) {
      html += '&nbsp;&nbsp;· ' + i.desc + (i.dim ? ' <em style="color:#888">' + i.dim + '</em>' : '') + '<br>';
    });
  });
  var prev = document.getElementById('mc-preview');
  prev.innerHTML = html;
  prev.style.display = 'block';
}

function gerarPDFColar() {
  _orcColar = parsearColar();
  if (!_orcColar.ambientes.length) { alert('Cole o texto do orçamento primeiro.'); return; }
  gerarPDF(_orcColar);
}

function salvarColar() {
  _orcColar = parsearColar();
  if (!_orcColar.ambientes.length) { alert('Cole o texto do orçamento primeiro.'); return; }
  saveOrcamento(_orcColar);
  fecharModalColar();
  renderTabela();
  alert('✅ Orçamento salvo!');
}

// Fechar clicando fora
document.getElementById('modal-colar').addEventListener('click', function(e) {
  if (e.target === this) fecharModalColar();
});
</script>

<div id="modal-pgto" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:16px;padding:32px;width:460px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.2)">
    <h3 style="color:#1E3A5F;font-size:18px;margin-bottom:6px" id="modal-pgto-titulo">Registrar Pagamento</h3>
    <p style="color:#888;font-size:13px;margin-bottom:24px" id="modal-pgto-sub">Informe os dados do pagamento para aprovar o orçamento.</p>

    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px">Valor Pago (R$)</label>
      <input type="text" id="mpgto-valor" placeholder="0,00" style="width:100%;border:1.5px solid #ddd;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;outline:none;box-sizing:border-box">
    </div>
    <div style="display:flex;gap:12px;margin-bottom:14px">
      <div style="flex:1">
        <label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px">Forma de Pagamento</label>
        <select id="mpgto-forma" style="width:100%;border:1.5px solid #ddd;border-radius:8px;padding:10px 14px;font-size:13px;outline:none;background:#fff">
          <option value="">Selecione...</option>
          <option>Pix</option>
          <option>Débito</option>
          <option>Crédito</option>
          <option>Dinheiro</option>
          <option>Transferência</option>
          <option>Parcelado</option>
        </select>
      </div>
      <div style="flex:1">
        <label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px">Data do Pagamento</label>
        <input type="text" id="mpgto-data" placeholder="dd/mm/aaaa" style="width:100%;border:1.5px solid #ddd;border-radius:8px;padding:10px 14px;font-size:13px;outline:none;box-sizing:border-box">
      </div>
    </div>
    <div id="mpgto-restante" style="background:#fef9c3;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:20px;display:none">
      <strong>Valor restante:</strong> <span id="mpgto-restante-val">R$ 0,00</span>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="fecharModalPgto()" style="background:#fff;border:1.5px solid #ddd;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer">Cancelar</button>
      <button id="btn-confirmar-pgto" onclick="confirmarModalPgto()" style="background:#1E3A5F;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:13px;font-weight:700;cursor:pointer">Confirmar e Aprovar</button>
    </div>
  </div>
</div>
</body>
</html>
