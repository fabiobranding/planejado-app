<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo — OrçaMármore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <h2>Catálogo de Itens</h2>
      <div class="user-info" id="user-name"></div>
    </div>
    <div class="content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 style="color:#1B5E20;font-size:16px">Itens do Catálogo</h3>
        <button class="btn-novo" onclick="abrirModal()">+ Novo Item</button>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="text" id="busca" placeholder="Buscar item..." oninput="renderTabela()">
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Nome</th><th>Descrição</th><th>Unidade</th><th>Ações</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Novo Item</div>
    <div class="form-group" style="margin-bottom:14px">
      <label>Nome do item</label>
      <input type="text" id="m-nome" placeholder="Ex: Bancada, Nicho embutido...">
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label>Descrição</label>
      <input type="text" id="m-desc" placeholder="Descrição detalhada">
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label>Unidade</label>
      <select id="m-unidade">
        <option>unidade</option>
        <option>m²</option>
        <option>metro linear</option>
        <option>conjunto</option>
        <option>serviço</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarItem()">Salvar</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script>
requireAuth();
applyCompanyTheme();
seedDemoData();
document.getElementById('sidebar').innerHTML = renderSidebar('catalogo');
const u = getUsuario();
const emp = getEmpresa();
document.getElementById('user-name').textContent = emp.nome || (u && u.marmoraria) || '';

var editandoId = null;

function renderTabela() {
  var busca = document.getElementById('busca').value.toLowerCase();
  var cat = getCatalogo().filter(function(c) {
    return !busca || (c.nome||'').toLowerCase().includes(busca) || (c.descricao||'').toLowerCase().includes(busca);
  });
  var tbody = document.getElementById('tbody');
  if (!cat.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:32px;color:#aaa">Nenhum item no catálogo.</td></tr>';
    return;
  }
  tbody.innerHTML = cat.map(function(c) {
    return '<tr>' +
      '<td><strong>' + (c.nome||'') + '</strong></td>' +
      '<td style="color:#666">' + (c.descricao||'') + '</td>' +
      '<td><span class="badge badge-aprovado">' + (c.unidade||'') + '</span></td>' +
      '<td><div class="actions">' +
        '<button class="btn btn-sm btn-outline" onclick="editarItem(\'' + c.id + '\')">Editar</button>' +
        '<button class="btn btn-sm btn-danger" onclick="excluirItem(\'' + c.id + '\')">Excluir</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function abrirModal(id) {
  editandoId = null;
  document.getElementById('modal-title').textContent = 'Novo Item';
  document.getElementById('m-nome').value = '';
  document.getElementById('m-desc').value = '';
  document.getElementById('m-unidade').value = 'unidade';
  if (id) {
    var item = getCatalogo().find(function(c) { return c.id === id; });
    if (item) {
      editandoId = id;
      document.getElementById('modal-title').textContent = 'Editar Item';
      document.getElementById('m-nome').value = item.nome || '';
      document.getElementById('m-desc').value = item.descricao || '';
      document.getElementById('m-unidade').value = item.unidade || 'unidade';
    }
  }
  document.getElementById('modal').classList.add('open');
}

function fecharModal() {
  document.getElementById('modal').classList.remove('open');
}

function editarItem(id) { abrirModal(id); }

function salvarItem() {
  var nome = document.getElementById('m-nome').value.trim();
  var descricao = document.getElementById('m-desc').value.trim();
  var unidade = document.getElementById('m-unidade').value;
  if (!nome) { alert('Informe o nome do item.'); return; }
  var cat = getCatalogo();
  if (editandoId) {
    var idx = cat.findIndex(function(c) { return c.id === editandoId; });
    if (idx >= 0) { cat[idx].nome = nome; cat[idx].descricao = descricao; cat[idx].unidade = unidade; }
  } else {
    cat.push({ id: gerarId(), nome: nome, descricao: descricao, unidade: unidade });
  }
  setCatalogo(cat);
  fecharModal();
  renderTabela();
}

function excluirItem(id) {
  if (!confirm('Excluir este item do catálogo?')) return;
  setCatalogo(getCatalogo().filter(function(c) { return c.id !== id; }));
  renderTabela();
}

// Fechar modal clicando fora
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});

renderTabela();
</script>
</body>
</html>
