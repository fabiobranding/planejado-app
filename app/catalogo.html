</head>

      Dashboard
    </a>
    <a href="orcamentos.html" class="nav-link">

      Orçamentos

    <a href="planos.html" class="nav-link">

      <button onclick="logout()" class="btn-logout">&#x2192; Sair</button>

  </nav>

  <!-- HEADER -->
  <header class="app-header">
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    <div>
      <div class="app-header-title" id="headerEmpresa">Minha Empresa</div>
      <div class="app-header-sub">Catálogo de Itens</div>
    </div>
    <div class="header-right">
      <button class="btn btn-amber" onclick="abrirModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo Item
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="app-main">
    <h1 class="page-title">Catálogo de Itens</h1>
    <p class="page-subtitle">Itens salvos aqui aparecem como sugestão ao montar orçamentos.</p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Descrição padrão</th>
            <th>Preço unitário</th>
            <th>Unidade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaCatalogo"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal item -->
<div class="modal-backdrop" id="modalItem">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Novo Item</div>
    <input type="hidden" id="itemId">
    <div class="form-group">
      <label class="form-label">Nome do item *</label>
      <input type="text" class="form-control" id="itemNome" placeholder="ex: Armário de Cozinha Aéreo">
    </div>
    <div class="form-group">
      <label class="form-label">Descrição padrão</label>
      <input type="text" class="form-control" id="itemDesc" placeholder="ex: Armário aéreo com 2 portas em MDF">
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Preço unitário (R$)</label>
        <input type="number" class="form-control" id="itemPreco" min="0" step="0.01" placeholder="0,00">
      </div>
      <div class="form-group">
        <label class="form-label">Unidade</label>
        <select class="form-control" id="itemUnidade">
          <option value="unidade">Unidade</option>
          <option value="m2">m²</option>
          <option value="ml">Metro linear</option>
          <option value="par">Par</option>
        </select>
      </div>
    </div>
    <div id="erroItem" class="alert alert-danger" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarItem()">Salvar</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script>
requireAuth();

function renderTabela() {
  const lista = getCatalogo();
  const tbody = document.getElementById('tabelaCatalogo');
  if (lista.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><p>Nenhum item no catálogo ainda.</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(i => `
    <tr>
      <td><strong>${i.nome || '—'}</strong></td>
      <td style="color:#666;font-size:.875rem">${i.descricao || '—'}</td>
      <td>R$ ${formatBRL(i.preco)}</td>
      <td><span class="badge badge-gray">${i.unidade || 'unidade'}</span></td>
      <td class="actions-cell">
        <button onclick="editarItem('${i.id}')" class="btn-table btn-table-edit">Editar</button>
        <button onclick="excluirItem('${i.id}')" class="btn-table btn-table-del">Excluir</button>
      </td>
    </tr>
  `).join('');
}

function abrirModal(id) {
  document.getElementById('erroItem').style.display = 'none';
  if (id) {
    const item = getCatalogo().find(i => i.id === id);
    if (!item) return;
    document.getElementById('modalTitle').textContent = 'Editar Item';
    document.getElementById('itemId').value = item.id;
    document.getElementById('itemNome').value = item.nome || '';
    document.getElementById('itemDesc').value = item.descricao || '';
    document.getElementById('itemPreco').value = item.preco || 0;
    document.getElementById('itemUnidade').value = item.unidade || 'unidade';
  } else {
    document.getElementById('modalTitle').textContent = 'Novo Item';
    document.getElementById('itemId').value = '';
    document.getElementById('itemNome').value = '';
    document.getElementById('itemDesc').value = '';
    document.getElementById('itemPreco').value = '';
    document.getElementById('itemUnidade').value = 'unidade';
  }
  document.getElementById('modalItem').classList.add('open');
}

function fecharModal() {
  document.getElementById('modalItem').classList.remove('open');
}

function salvarItem() {
  const nome = document.getElementById('itemNome').value.trim();
  if (!nome) {
    document.getElementById('erroItem').textContent = 'Informe o nome do item.';
    document.getElementById('erroItem').style.display = 'block';
    return;
  }
  const id = document.getElementById('itemId').value || gerarId();
  const item = {
    id,
    nome,
    descricao: document.getElementById('itemDesc').value.trim(),
    preco: parseFloat(document.getElementById('itemPreco').value) || 0,
    unidade: document.getElementById('itemUnidade').value,
  };
  saveCatalogoItem(item);
  fecharModal();
  renderTabela();
}

function editarItem(id) { abrirModal(id); }

function excluirItem(id) {
  if (!confirm('Excluir este item do catálogo?')) return;
  deleteCatalogoItem(id);
  renderTabela();
}

document.getElementById('modalItem').addEventListener('click', e => {
  if (e.target === document.getElementById('modalItem')) fecharModal();
});

renderTabela();
</script>
</body>
</html>
