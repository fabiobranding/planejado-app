<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — OrçaMármore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <h2>Dashboard</h2>
      <div class="user-info" id="user-name"></div>
    </div>
    <div class="content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 style="color:#1B5E20;font-size:16px">Visão Geral</h3>
        <button class="btn-novo" onclick="location.href='novo-orcamento.html'">+ Novo Orçamento</button>
      </div>
      <div class="stats-grid" id="stats"></div>
      <div class="card">
        <div class="card-title">Últimos Orçamentos</div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>N°</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Status</th><th>Ações</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/pdf.js"></script>
<script>
requireAuth();
seedDemoData();
document.getElementById('sidebar').innerHTML = renderSidebar('dashboard');
const u = getUsuario();
const emp = getEmpresa();
document.getElementById('user-name').textContent = emp.nome || (u && u.marmoraria) || (u && u.nome) || '';

const orcs = getOrcamentos();
const mes = new Date().getMonth();
const ano = new Date().getFullYear();
const doMes = orcs.filter(function(o) {
  var partes = (o.data || '').split('/');
  if (partes.length < 3) return false;
  return parseInt(partes[1])-1 === mes && parseInt(partes[2]) === ano;
});
const totalMes = doMes.reduce(function(s, o) { return s + (Number(o.valor) || 0); }, 0);
const aprovados = doMes.filter(function(o) { return o.status === 'Aprovado'; }).length;
const taxa = doMes.length ? Math.round(aprovados / doMes.length * 100) : 0;
const aguardando = orcs.filter(function(o) { return o.status === 'Em aberto'; }).length;

document.getElementById('stats').innerHTML =
  '<div class="stat-card"><div class="stat-label">Total Orçado (mês)</div><div class="stat-value">R$ ' + formatBRL(totalMes) + '</div></div>' +
  '<div class="stat-card"><div class="stat-label">Aprovados (mês)</div><div class="stat-value">' + aprovados + '</div></div>' +
  '<div class="stat-card"><div class="stat-label">Taxa de Aprovação</div><div class="stat-value">' + taxa + '%</div></div>' +
  '<div class="stat-card"><div class="stat-label">Aguardando Resposta</div><div class="stat-value">' + aguardando + '</div></div>';

const ultimos = orcs.slice(0, 5);
document.getElementById('tbody').innerHTML = ultimos.length
  ? ultimos.map(function(o) {
      return '<tr>' +
        '<td>' + (o.numero||'') + '</td>' +
        '<td><strong>' + (o.cliente||'') + '</strong></td>' +
        '<td>' + (o.data||'') + '</td>' +
        '<td>R$ ' + formatBRL(o.valor) + '</td>' +
        '<td>' + statusBadge(o.status) + '</td>' +
        '<td><div class="actions">' +
          '<button class="btn btn-sm btn-outline" onclick="location.href=\'novo-orcamento.html?id=' + o.id + '\'">Editar</button>' +
          '<button class="btn btn-sm btn-primary" onclick="verPDF(\'' + o.id + '\')">PDF</button>' +
        '</div></td>' +
      '</tr>';
    }).join('')
  : '<tr><td colspan="6" style="text-align:center;padding:32px;color:#aaa">Nenhum orçamento ainda. Crie o primeiro!</td></tr>';

function verPDF(id) {
  var orc = getOrcamentos().find(function(o) { return o.id === id; });
  if (orc) gerarPDF(orc);
}
</script>
</body>
</html>
