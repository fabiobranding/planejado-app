<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurações — OrçaMármore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <h2>Configurações</h2>
      <div class="user-info" id="user-name"></div>
    </div>
    <div class="content">

      <!-- Dados da empresa -->
      <div class="card">
        <div class="card-title">Dados da Empresa</div>
        <div class="form-row">
          <div class="form-group">
            <label>Nome da Marmoraria</label>
            <input type="text" id="conf-nome" placeholder="Ex: Mármore Premium">
          </div>
          <div class="form-group">
            <label>CNPJ</label>
            <input type="text" id="conf-cnpj" placeholder="00.000.000/0001-00">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Telefone</label>
            <input type="tel" id="conf-telefone" placeholder="(11) 3333-3333">
          </div>
          <div class="form-group">
            <label>WhatsApp</label>
            <input type="tel" id="conf-whatsapp" placeholder="(11) 99999-9999">
          </div>
          <div class="form-group">
            <label>Instagram</label>
            <input type="text" id="conf-instagram" placeholder="@marmorariaprogramar">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="conf-email" placeholder="contato@marmoraria.com">
          </div>
          <div class="form-group" style="flex:2">
            <label>Endereço</label>
            <input type="text" id="conf-endereco" placeholder="Rua, número, bairro, cidade — SP">
          </div>
        </div>
      </div>

      <!-- Logo -->
      <div class="card">
        <div class="card-title">Logo da Empresa</div>
        <div class="logo-upload" onclick="document.getElementById('logo-input').click()">
          <img id="logo-preview" class="logo-preview" src="" style="display:none">
          <div id="logo-placeholder">
            <div style="font-size:32px;margin-bottom:8px">🖼️</div>
            <div style="font-size:13px;color:#666">Clique para fazer upload da logo</div>
            <div style="font-size:11px;color:#aaa;margin-top:4px">PNG, JPG — até 2 MB</div>
          </div>
        </div>
        <input type="file" id="logo-input" accept="image/*" style="display:none" onchange="carregarLogo(this)">
        <div style="margin-top:10px">
          <button class="btn btn-sm btn-outline" onclick="document.getElementById('logo-input').click()">Alterar logo</button>
          <button class="btn btn-sm" style="background:#fff;border:1px solid #ddd;margin-left:8px" onclick="removerLogo()">Remover</button>
        </div>
      </div>

      <!-- PDF -->
      <div class="card">
        <div class="card-title">Configurações do PDF</div>
        <div class="form-row">
          <div class="form-group" style="max-width:320px">
            <label>Cor dos PDFs e do sistema</label>
            <select id="conf-cor">
              <option value="#1E3A5F">Verde Marmoraria (padrão)</option>
              <option value="#1A237E">Azul Profissional</option>
              <option value="#212121">Preto Elegante</option>
              <option value="#B71C1C">Vermelho Premium</option>
              <option value="#4A148C">Roxo Sofisticado</option>
            </select>
            <div id="aviso-cor" style="display:none;margin-top:8px;font-size:12px;color:#2a4a7f;font-weight:700;background:#EEF2FF;padding:6px 10px;border-radius:6px"></div>
            <div style="font-size:11px;color:#aaa;margin-top:6px">💡 Faça upload do logo para extrair a cor automaticamente</div>
          </div>
        </div>
        <div class="form-group">
          <label>Observações padrão (aparece em todos os PDFs)</label>
          <textarea id="conf-obs" rows="5" style="border:1.5px solid #ddd;border-radius:7px;padding:10px 12px;font-size:13px;outline:none;font-family:Arial;resize:vertical;width:100%" placeholder="Ex: 1. Prazo de execução...&#10;2. Garantia..."></textarea>
        </div>
      </div>

      <!-- WhatsApp -->
      <div class="card">
        <div class="card-title">Mensagem WhatsApp</div>
        <div class="form-group">
          <label>Mensagem padrão ao enviar orçamento</label>
          <textarea id="conf-whats-msg" rows="4" style="border:1.5px solid #ddd;border-radius:7px;padding:10px 12px;font-size:13px;outline:none;font-family:Arial;resize:vertical;width:100%" placeholder="Ex: Olá! Segue seu orçamento..."></textarea>
        </div>
        <div style="font-size:11px;color:#888;margin-top:4px">Se vazio, uma mensagem padrão será usada automaticamente.</div>
      </div>

      <div style="display:flex;gap:12px">
        <button class="btn btn-primary" onclick="salvarConfig()">💾 Salvar Configurações</button>
      </div>
      <div id="msg-save" style="display:none;background:#EEF2FF;color:#2a4a7f;border-radius:6px;padding:10px 14px;font-size:13px;margin-top:14px;font-weight:700">
        Configurações salvas com sucesso!
      </div>

    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script>
requireAuth();
applyCompanyTheme();
document.getElementById('sidebar').innerHTML = renderSidebar('config');
const u = getUsuario();
const emp = getEmpresa();
document.getElementById('user-name').textContent = emp.nome || (u && u.marmoraria) || '';

// Carregar dados
document.getElementById('conf-nome').value = emp.nome || '';
document.getElementById('conf-cnpj').value = emp.cnpj || '';
document.getElementById('conf-telefone').value = emp.telefone || '';
document.getElementById('conf-whatsapp').value = emp.whatsapp || '';
document.getElementById('conf-instagram').value = emp.instagram || '';
document.getElementById('conf-email').value = emp.email || '';
document.getElementById('conf-endereco').value = emp.endereco || '';
document.getElementById('conf-obs').value = emp.observacoes || '';
document.getElementById('conf-whats-msg').value = emp.msgWhatsApp || '';
if (emp.corPDF) document.getElementById('conf-cor').value = emp.corPDF;

if (emp.logo) {
  document.getElementById('logo-preview').src = emp.logo;
  document.getElementById('logo-preview').style.display = 'block';
  document.getElementById('logo-placeholder').style.display = 'none';
}

function carregarLogo(input) {
  var file = input.files[0];
  if (!file) return;
  if (file.size > 2*1024*1024) { alert('Arquivo muito grande. Use imagens até 2 MB.'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var src = e.target.result;
    document.getElementById('logo-preview').src = src;
    document.getElementById('logo-preview').style.display = 'block';
    document.getElementById('logo-placeholder').style.display = 'none';

    // Extrai cor dominante e aplica automaticamente
    extractDominantColor(src, function(cor) {
      document.getElementById('conf-cor').value = cor;
      // Adiciona opção personalizada se não existir
      var sel = document.getElementById('conf-cor');
      var exists = Array.from(sel.options).some(function(o){ return o.value === cor; });
      if (!exists) {
        var opt = document.createElement('option');
        opt.value = cor; opt.textContent = '🎨 Cor extraída do logo (' + cor + ')';
        sel.insertBefore(opt, sel.firstChild);
      }
      sel.value = cor;
      // Preview imediato da cor na sidebar
      var emp = getEmpresa();
      emp.corPDF = cor;
      setEmpresa(emp);
      applyCompanyTheme();

      // Mostra aviso
      var av = document.getElementById('aviso-cor');
      if (av) { av.style.display = 'block'; av.textContent = '✅ Cor extraída do logo: ' + cor; }
    });
  };
  reader.readAsDataURL(file);
}

function removerLogo() {
  document.getElementById('logo-preview').src = '';
  document.getElementById('logo-preview').style.display = 'none';
  document.getElementById('logo-placeholder').style.display = 'block';
  document.getElementById('logo-input').value = '';
}

function salvarConfig() {
  var logoSrc = document.getElementById('logo-preview').src;
  var logo = (logoSrc && !logoSrc.endsWith(location.href)) ? logoSrc : (getEmpresa().logo || '');
  if (logo && logo.startsWith('http') && !logo.startsWith('data:')) logo = getEmpresa().logo || '';

  setEmpresa({
    nome:        document.getElementById('conf-nome').value.trim(),
    cnpj:        document.getElementById('conf-cnpj').value.trim(),
    telefone:    document.getElementById('conf-telefone').value.trim(),
    whatsapp:    document.getElementById('conf-whatsapp').value.trim(),
    instagram:   document.getElementById('conf-instagram').value.trim(),
    email:       document.getElementById('conf-email').value.trim(),
    endereco:    document.getElementById('conf-endereco').value.trim(),
    observacoes: document.getElementById('conf-obs').value,
    msgWhatsApp: document.getElementById('conf-whats-msg').value,
    corPDF:      document.getElementById('conf-cor').value,
    logo:        document.getElementById('logo-preview').style.display !== 'none'
                   ? document.getElementById('logo-preview').src
                   : ''
  });

  applyCompanyTheme();
  var msg = document.getElementById('msg-save');
  msg.style.display = 'block';
  setTimeout(function() { msg.style.display = 'none'; }, 2500);
}
</script>
</body>
</html>
