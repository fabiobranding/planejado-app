<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — OrçaMármore</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#E8F5E9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.logo{font-size:28px;font-weight:900;color:#1B5E20;margin-bottom:28px;text-align:center}
.logo span{color:#4CAF50}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(27,94,32,.12);width:100%;max-width:440px;overflow:hidden}
.tabs{display:flex;border-bottom:2px solid #E8F5E9}
.tab{flex:1;padding:16px;text-align:center;font-size:14px;font-weight:700;cursor:pointer;color:#888;transition:all .2s;background:#fafafa;border:none}
.tab.active{background:#fff;color:#1B5E20;border-bottom:2px solid #1B5E20;margin-bottom:-2px}
.form-body{padding:28px}
.panel{display:none}
.panel.active{display:block}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.form-group input{width:100%;border:1.5px solid #ddd;border-radius:8px;padding:11px 14px;font-size:14px;outline:none;font-family:Arial;transition:border .2s}
.form-group input:focus{border-color:#1B5E20}
.btn-submit{width:100%;background:#1B5E20;color:#fff;padding:13px;border-radius:8px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-submit:hover{background:#2E7D32}
.msg-erro{background:#FFEBEE;color:#c62828;border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
.msg-ok{background:#E8F5E9;color:#2E7D32;border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
.footer-link{text-align:center;padding:16px;font-size:13px;color:#888;background:#fafafa;border-top:1px solid #f0f0f0}
.footer-link a{color:#1B5E20;font-weight:700;text-decoration:none}
.esqueceu{text-align:right;margin-top:-8px;margin-bottom:16px}
.esqueceu a{font-size:12px;color:#888;text-decoration:none}
.esqueceu a:hover{color:#1B5E20}
</style>
</head>
<body>

<div class="logo">Orça<span>Mármore</span></div>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="showTab('entrar')">Entrar</button>
    <button class="tab" onclick="showTab('cadastro')">Criar conta</button>
  </div>

  <!-- ABA ENTRAR -->
  <div class="panel active" id="panel-entrar">
    <div class="form-body">
      <div class="msg-erro" id="erro-entrar"></div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')fazerLogin()">
      </div>
      <div class="esqueceu"><a href="esqueci-senha.html">Esqueceu sua senha?</a></div>
      <button class="btn-submit" onclick="fazerLogin()">Entrar</button>
    </div>
  </div>

  <!-- ABA CADASTRO -->
  <div class="panel" id="panel-cadastro">
    <div class="form-body">
      <div class="msg-erro" id="erro-cadastro"></div>
      <div class="msg-ok" id="ok-cadastro"></div>
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="cad-nome" placeholder="Maria da Silva">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="cad-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Nome da marmoraria</label>
        <input type="text" id="cad-marmoraria" placeholder="Mármore & Cia">
      </div>
      <div class="form-group">
        <label>Telefone / WhatsApp</label>
        <input type="tel" id="cad-telefone" placeholder="(11) 99999-9999">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" id="cad-confirma" placeholder="Repita a senha">
      </div>
      <button class="btn-submit" onclick="fazerCadastro()">Criar conta grátis</button>
    </div>
  </div>

  <div class="footer-link">
    <a href="index.html">&larr; Voltar ao site</a>
  </div>
</div>

<script>
function gerarId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function getUsuarios() { return JSON.parse(localStorage.getItem('om_usuarios') || '[]'); }
function setUsuarios(u) { localStorage.setItem('om_usuarios', JSON.stringify(u)); }
function setUsuario(u) { localStorage.setItem('om_usuario', JSON.stringify(u)); }
function setEmpresaU(id, e) { localStorage.setItem('om_empresa_' + id, JSON.stringify(e)); }
function setOrcamentosU(id, list) { localStorage.setItem('om_orcamentos_' + id, JSON.stringify(list)); }
function setCatalogoU(id, list) { localStorage.setItem('om_catalogo_' + id, JSON.stringify(list)); }

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'entrar') || (i === 1 && tab === 'cadastro'));
  });
  document.getElementById('panel-entrar').classList.toggle('active', tab === 'entrar');
  document.getElementById('panel-cadastro').classList.toggle('active', tab === 'cadastro');
}

function fazerLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('erro-entrar');
  erroEl.style.display = 'none';

  if (!email || !senha) { erroEl.textContent = 'Preencha todos os campos.'; erroEl.style.display = 'block'; return; }

  const usuarios = getUsuarios();
  const u = usuarios.find(x => x.email.toLowerCase() === email && x.senha === senha);
  if (!u) { erroEl.textContent = 'E-mail ou senha incorretos.'; erroEl.style.display = 'block'; return; }

  setUsuario(u);
  window.location.href = 'app/dashboard.html';
}

function catalogoPadrao(gid) {
  return [
    { id: gid(), nome: 'Nicho embutido', descricao: 'Nicho em mármore sob medida', unidade: 'unidade' },
    { id: gid(), nome: 'Alisar 3cm', descricao: 'Alisar em mármore 3cm de espessura', unidade: 'metro linear' },
    { id: gid(), nome: 'Bancada', descricao: 'Bancada em mármore sob medida', unidade: 'm²' },
    { id: gid(), nome: 'Piso sob medida', descricao: 'Piso em mármore com rodapé', unidade: 'm²' },
    { id: gid(), nome: 'Soleira', descricao: 'Soleira em mármore', unidade: 'metro linear' },
    { id: gid(), nome: 'Peitoril', descricao: 'Peitoril em mármore', unidade: 'metro linear' },
    { id: gid(), nome: 'Prateleira', descricao: 'Prateleira em mármore', unidade: 'unidade' },
    { id: gid(), nome: 'Pia de banheiro', descricao: 'Pia esculpida em mármore', unidade: 'unidade' },
  ];
}

function fazerCadastro() {
  const nome       = document.getElementById('cad-nome').value.trim();
  const email      = document.getElementById('cad-email').value.trim().toLowerCase();
  const marmoraria = document.getElementById('cad-marmoraria').value.trim();
  const telefone   = document.getElementById('cad-telefone').value.trim();
  const senha      = document.getElementById('cad-senha').value;
  const confirma   = document.getElementById('cad-confirma').value;
  const erroEl     = document.getElementById('erro-cadastro');
  const okEl       = document.getElementById('ok-cadastro');
  erroEl.style.display = 'none'; okEl.style.display = 'none';

  if (!nome || !email || !marmoraria || !senha || !confirma) {
    erroEl.textContent = 'Preencha todos os campos.'; erroEl.style.display = 'block'; return;
  }
  if (senha.length < 6) {
    erroEl.textContent = 'A senha deve ter pelo menos 6 caracteres.'; erroEl.style.display = 'block'; return;
  }
  if (senha !== confirma) {
    erroEl.textContent = 'As senhas não coincidem.'; erroEl.style.display = 'block'; return;
  }

  const usuarios = getUsuarios();
  if (usuarios.find(x => x.email.toLowerCase() === email)) {
    erroEl.textContent = 'Este e-mail já está cadastrado.'; erroEl.style.display = 'block'; return;
  }

  const id = gerarId();
  const gid = () => gerarId();
  const novoUsuario = { id, nome, email, marmoraria, telefone, senha };
  usuarios.push(novoUsuario);
  setUsuarios(usuarios);
  setUsuario(novoUsuario);

  setEmpresaU(id, {
    nome: marmoraria, telefone, whatsapp: telefone,
    instagram: '', email, endereco: '', cnpj: '',
    corPDF: '#1B5E20', observacoes: '', msgWhatsApp: ''
  });

  setCatalogoU(id, catalogoPadrao(gid));

  // ── Orçamentos: 1 exemplo de mês anterior (stats ficam zeradas) ──
  const anoEx = new Date().getFullYear();
  const mesEx = new Date().getMonth(); // mês anterior (0-indexed, então mês atual - 1)
  const mesStr = mesEx === 0 ? '12' : String(mesEx).padStart(2, '0');
  const anoStr = mesEx === 0 ? String(anoEx - 1) : String(anoEx);

  // Orçamento especial para Daiane
  if (email === 'daiane.fgs2019@outlook.com') {
    const orcDaiane = {
      id: gid(), numero: anoEx + '/0001',
      cliente: 'Diana e Bruna', data: '29/05/' + anoEx,
      validade: '15 dias', material: 'Mármore Champagne',
      valor: 16160, status: 'Em aberto',
      ambientes: [
        { nome: 'Suíte 1', itens: [
          { desc: 'Nicho embutido', dim: '89 x 36 cm', qtd: '2 unidades', obs: '' },
          { desc: 'Alisar', dim: '3 cm', qtd: '', obs: '' }
        ]},
        { nome: 'Suíte 2', itens: [
          { desc: 'Nicho embutido', dim: '73,5 x 36 cm', qtd: '2 unidades', obs: '' },
          { desc: 'Alisar', dim: '3 cm', qtd: '', obs: '' }
        ]},
        { nome: 'Suíte 3', itens: [
          { desc: 'Nicho embutido', dim: '106,5 x 36 cm', qtd: '2 unidades', obs: '' },
          { desc: 'Alisar', dim: '3 cm', qtd: '', obs: '' }
        ]},
        { nome: 'Banho Master', itens: [
          { desc: 'Nicho embutido', dim: '1,12 x 36 cm', qtd: '2 unidades', obs: '' },
          { desc: 'Nicho embutido com prateleiras', dim: '1,00 x 22 cm', qtd: '4 unidades', obs: 'Com prateleiras' },
          { desc: 'Alisar', dim: '3 cm', qtd: '', obs: '' }
        ]},
        { nome: 'Piso', itens: [
          { desc: 'Piso sob medida com rodapé', dim: 'Sob medida', qtd: '', obs: '' }
        ]}
      ]
    };
    setOrcamentosU(id, [orcDaiane]);
  } else {
    // Conta normal: 1 orçamento de exemplo do mês anterior (stats zeradas)
    const orcExemplo = {
      id: gid(), numero: anoStr + '/0001',
      cliente: 'Exemplo — Maria Silva', data: '10/' + mesStr + '/' + anoStr,
      validade: '15 dias', material: 'Mármore Champagne',
      valor: 4500, status: 'Aprovado',
      ambientes: [
        { nome: 'Banheiro', itens: [
          { desc: 'Bancada', dim: '1,20 x 0,60 m', qtd: '1 unidade', obs: '' },
          { desc: 'Nicho embutido', dim: '60 x 30 cm', qtd: '2 unidades', obs: '' }
        ]}
      ]
    };
    setOrcamentosU(id, [orcExemplo]);
  }

  okEl.textContent = 'Conta criada com sucesso! Redirecionando...';
  okEl.style.display = 'block';
  setTimeout(() => { window.location.href = 'app/dashboard.html'; }, 1200);
}
</script>
</body>
</html>
